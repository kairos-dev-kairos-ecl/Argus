{{- /* Ingest Deployment */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "argus.fullname" . }}-ingest
  labels:
    {{- include "argus.labels" . | nindent 4 }}
    component: ingest
spec:
  replicas: {{ .Values.replicaCount.ingest }}
  selector:
    matchLabels:
      {{- include "argus.selectorLabels" . | nindent 6 }}
      component: ingest
  template:
    metadata:
      labels:
        {{- include "argus.selectorLabels" . | nindent 8 }}
        component: ingest
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "argus.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: argus
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
          - /usr/local/bin/argus
        args:
          - ingest
          - --grpc-addr=0.0.0.0:5001
          - --http-addr=0.0.0.0:8080
          - --postgres-dsn=postgres://{{ .Values.storage.postgres.username }}:{{ .Values.storage.postgres.password }}@{{ .Values.storage.postgres.host }}:{{ .Values.storage.postgres.port }}/{{ .Values.storage.postgres.database }}?sslmode={{ .Values.storage.postgres.sslMode }}
          - --clickhouse-dsn=clickhouse://{{ .Values.storage.clickhouse.addr }}/{{ .Values.storage.clickhouse.database }}
          - --queue-capacity={{ .Values.ingest.queueCapacity }}
          - --batch-size={{ .Values.ingest.batchSize }}
          - --batch-interval={{ .Values.ingest.flushInterval }}
        ports:
        - name: grpc
          containerPort: 5001
          protocol: TCP
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: ARGUS_LOGGING_LEVEL
          value: {{ .Values.logging.level | quote }}
        - name: ARGUS_LOGGING_FORMAT
          value: {{ .Values.logging.format | quote }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}

---

