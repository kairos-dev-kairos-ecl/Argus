name: Protobuf Schema CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'proto/**'
      - '.github/workflows/protobuf.yaml'
  pull_request:
    paths:
      - 'proto/**'
      - '.github/workflows/protobuf.yaml'

jobs:
  schema-check:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for breaking checks

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: latest

      - name: Format Check
        run: cd proto && buf format --diff

      - name: Lint Check
        run: cd proto && buf lint

      - name: Breaking Change Check
        run: |
          cd proto
          if git rev-parse origin/main >/dev/null 2>&1; then
            buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main"
          else
            echo "⚠ Skipping breaking check (main branch not available)"
          fi

  generate:
    name: Generate Stubs
    runs-on: ubuntu-latest
    needs: schema-check
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1

      - uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Stubs
        run: cd proto && buf generate

      - name: Verify Go Stubs Compile
        run: |
          cd proto/gen/go
          go mod init argus/stubs 2>/dev/null || true
          go build ./...

      - name: Verify Python Stubs
        run: |
          python -m py_compile proto/gen/python/argus/**/*.py || \
          echo "⚠ Python stubs not generated (OK for non-Python setup)"

      - name: Verify TypeScript Stubs
        run: |
          cd proto/gen/typescript
          npm init -y 2>/dev/null
          npm install typescript --save-dev 2>/dev/null
          npx tsc --noEmit **/*.ts || \
          echo "⚠ TypeScript stubs not generated (OK for non-TS setup)"

      - name: Upload Generated Stubs (Artifact)
        uses: actions/upload-artifact@v3
        with:
          name: protobuf-stubs
          path: proto/gen/
          retention-days: 7

  summary:
    name: Schema CI Summary
    runs-on: ubuntu-latest
    needs: [schema-check, generate]
    if: always()
    steps:
      - name: Check Status
        run: |
          if [ "${{ needs.schema-check.result }}" = "failure" ] || [ "${{ needs.generate.result }}" = "failure" ]; then
            echo "❌ Protobuf schema CI failed"
            exit 1
          else
            echo "✅ Protobuf schema CI passed"
          fi
