name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write   # for GHCR Docker image push

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build binaries for all platforms
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          # Linux
          - os: linux
            arch: amd64
            runs-on: ubuntu-latest
            binary: argus-linux-amd64
          - os: linux
            arch: arm64
            runs-on: ubuntu-latest
            binary: argus-linux-arm64
          # macOS
          - os: darwin
            arch: amd64
            runs-on: macos-latest
            binary: argus-darwin-amd64
          - os: darwin
            arch: arm64
            runs-on: macos-latest
            binary: argus-darwin-arm64
          # Windows
          - os: windows
            arch: amd64
            runs-on: ubuntu-latest
            binary: argus-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build \
            -ldflags "-s -w \
              -X main.Version=${{ github.ref_name }} \
              -X main.BuildDate=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
              -X main.Commit=${{ github.sha }}" \
            -o ${{ matrix.binary }} \
            ./cmd/argus

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Generate SHA-256 checksums for all binaries
  # ─────────────────────────────────────────────────────────────────────────────
  checksums:
    name: Generate Checksums
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd binaries
          sha256sum argus-* > checksums.txt
          echo "Checksums:"
          cat checksums.txt

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: binaries/checksums.txt
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Build and push Docker image to GitHub Container Registry
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/argus
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            COMMIT=${{ github.sha }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Create GitHub Release with all binaries, checksums, and install scripts
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [checksums, docker]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Prepare release files
        run: |
          mkdir -p release
          cp release-artifacts/argus-* release/ 2>/dev/null || true
          cp release-artifacts/checksums.txt release/
          cp install.sh release/
          cp install.ps1 release/
          ls -lh release/

      - name: Generate release notes header
        run: |
          TAG="${{ github.ref_name }}"
          cat > release_notes_header.md << 'NOTES'
          ## Install

          **Linux / macOS:**
          ```bash
          curl -fsSL https://raw.githubusercontent.com/kairos-dev-kairos-ecl/Argus/main/install.sh | bash
          ```

          **Windows (PowerShell — run as Administrator):**
          ```powershell
          irm https://raw.githubusercontent.com/kairos-dev-kairos-ecl/Argus/main/install.ps1 | iex
          ```

          **Docker:**
          ```bash
          docker pull ghcr.io/kairos-dev-kairos-ecl/argus:latest
          docker compose up -d   # using the repo's docker-compose.yml
          ```

          **Manual download:** Pick the binary for your platform from the assets below, then `chmod +x` it (Linux/macOS) or run it directly (Windows).

          | Platform | Binary |
          |----------|--------|
          | Linux x86_64 | `argus-linux-amd64` |
          | Linux ARM64 | `argus-linux-arm64` |
          | macOS x86_64 | `argus-darwin-amd64` |
          | macOS Apple Silicon | `argus-darwin-arm64` |
          | Windows x86_64 | `argus-windows-amd64.exe` |

          Verify your download against `checksums.txt` (SHA-256).

          ---

          NOTES

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: release_notes_header.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
