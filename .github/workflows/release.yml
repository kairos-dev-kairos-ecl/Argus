name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          # Linux builds
          - os: linux
            arch: amd64
            runs-on: ubuntu-latest
          - os: linux
            arch: arm64
            runs-on: ubuntu-latest
          # macOS builds
          - os: darwin
            arch: amd64
            runs-on: macos-latest
          - os: darwin
            arch: arm64
            runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags "-X main.Version=${{ github.ref_name }} -X main.BuildDate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -o argus-${{ matrix.os }}-${{ matrix.arch }} \
            ./cmd/argus

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: argus-${{ matrix.os }}-${{ matrix.arch }}
          path: argus-${{ matrix.os }}-${{ matrix.arch }}
          retention-days: 1

  checksums:
    name: Generate Checksums
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Generate checksums
        run: |
          cd binaries
          for dir in */; do
            cd "$dir"
            sha256sum * >> ../checksums.txt
            cd ..
          done
          cat checksums.txt

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: binaries/checksums.txt
          retention-days: 1

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: checksums
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize artifacts
        run: |
          mkdir -p release
          # Flatten directory structure
          find release-artifacts -type f -name "argus-*" ! -name "*.txt" -exec cp {} release/ \;
          cp release-artifacts/checksums/checksums.txt release/
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

