syntax = "proto3";

package argus.v1;

option go_package = "github.com/argusxdr/argus/gen/go/argus/v1;v1";

// SignalCategory represents the canonical category strings for all layers
enum SignalCategory {
  CATEGORY_UNSPECIFIED = 0;

  // L1 — Hardware/Infrastructure
  INFRA_GPU_UTILIZATION = 101;
  INFRA_GPU_MEMORY = 102;
  INFRA_CONTAINER_LIFECYCLE = 103;
  INFRA_NETWORK_THROUGHPUT = 104;

  // L2 — Model Weights
  MODEL_VERSION_CHANGE = 201;
  MODEL_WEIGHT_INTEGRITY = 202;
  MODEL_QUANTIZATION_EVENT = 203;

  // L3 — Tokenizer
  TOKENIZER_ENCODING = 301;
  TOKENIZER_ANOMALY = 302;
  TOKENIZER_VERSION_MISMATCH = 303;

  // L4 — Transformer/Inference
  INFERENCE_ATTENTION_DISTRIBUTION = 401;
  INFERENCE_ACTIVATION_MAGNITUDE = 402;
  INFERENCE_KV_CACHE_UTILIZATION = 403;
  INFERENCE_LATENCY_PER_LAYER = 404;

  // L5 — Output/Decoding
  OUTPUT_GENERATION = 501;
  OUTPUT_LOGPROBS = 502;
  OUTPUT_TRUNCATION = 503;
  OUTPUT_STREAMING = 504;

  // L6 — Safety/Alignment
  SAFETY_INPUT_CLASSIFIER = 601;
  SAFETY_OUTPUT_FILTER = 602;
  SAFETY_POLICY_VIOLATION = 603;
  SAFETY_BYPASS_ATTEMPT = 604;

  // L7 — RAG/Retrieval
  RETRIEVAL_EMBEDDING = 701;
  RETRIEVAL_SEARCH = 702;
  RETRIEVAL_RERANK = 703;
  RETRIEVAL_CHUNK_INJECT = 704;
  RETRIEVAL_INDEX_HEALTH = 705;
  RETRIEVAL_INGESTION = 706;

  // L8 — Agents/Tools
  AGENT_TOOL_CALL = 801;
  AGENT_TOOL_RESULT = 802;
  AGENT_PLANNING = 803;
  AGENT_DELEGATION = 804;
  AGENT_LOOP_ITERATION = 805;
  AGENT_PERMISSION_REQUEST = 806;

  // L9 — API Gateway
  GATEWAY_AUTH = 901;
  GATEWAY_RATE_LIMIT = 902;
  GATEWAY_ROUTING = 903;
  GATEWAY_BILLING = 904;
  GATEWAY_ERROR = 905;

  // L10 — Application
  APP_SESSION_START = 1001;
  APP_SESSION_END = 1002;
  APP_USER_MESSAGE = 1003;
  APP_USER_FEEDBACK = 1004;
  APP_CONVERSATION_METADATA = 1005;
  APP_ERROR = 1006;
}
